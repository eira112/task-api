services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: task_api
      POSTGRES_USER: anushka
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
  task-api:
    build: .
    depends_on: 
      - postgres
    environment:
      - DATABASE_URL=postgresql+psycopg://anushka:password@postgres:5432/task_api
